<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Server - Secure Messaging</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
            background-color: #1e1e1e;
            color: #fff;
        }
        h1 {
            color: #00d4ff;
            text-align: center;
        }
        .container {
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .host-btn {
            background-color: #00d4ff;
            color: #1e1e1e;
        }
        .host-btn:hover {
            background-color: #00a3cc;
        }
        .join-btn {
            background-color: #ff6b6b;
            color: white;
        }
        .join-btn:hover {
            background-color: #cc5555;
        }
        .form-section {
            display: none;
            background-color: #3d3d3d;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .form-section.active {
            display: block;
        }
        .form-section h2 {
            margin-top: 0;
            color: #00d4ff;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
            background-color: #4d4d4d;
            color: #fff;
        }
        input::placeholder {
            color: #999;
        }
        .submit-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #00d4ff;
            color: #1e1e1e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .submit-btn:hover {
            background-color: #00a3cc;
        }
        .chat-area {
            display: none;
            background-color: #3d3d3d;
            padding: 15px;
            border-radius: 5px;
        }
        .chat-area.active {
            display: block;
        }
        .messages {
            height: 300px;
            background-color: #4d4d4d;
            border-radius: 5px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            background-color: #5d5d5d;
            max-width: 70%;
            align-self: flex-start;
        }
        .message.own {
            background-color: #00d4ff;
            color: #1e1e1e;
            text-align: right;
            align-self: flex-end;
        }
        .message.other {
            background-color: #555;
            color: #fff;
        }
        .message-input-group {
            display: flex;
            gap: 10px;
        }
        .message-input-group input {
            flex: 1;
            margin: 0;
        }
        .message-input-group button {
            width: 60px;
            padding: 0;
            background-color: #00d4ff;
            color: #1e1e1e;
        }
        .message-input-group button:hover {
            background-color: #00a3cc;
        }
        .status {
            margin-top: 15px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .status.active {
            display: block;
        }
        .status.success {
            background-color: #2d5016;
            color: #00ff00;
            border-left: 4px solid #00ff00;
        }
        .status.info {
            background-color: #003d5c;
            color: #00d4ff;
            border-left: 4px solid #00d4ff;
        }
        .server-info {
            background-color: #4d4d4d;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        .users-list {
            background-color: #4d4d4d;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 12px;
            max-height: 80px;
            overflow-y: auto;
        }
        .users-list .user {
            display: inline-block;
            background-color: #00d4ff;
            color: #1e1e1e;
            padding: 4px 8px;
            border-radius: 3px;
            margin: 2px;
            font-weight: bold;
        }
        .message {
            margin: 8px 0;
            padding: 10px;
            border-radius: 5px;
            background-color: #5d5d5d;
            word-wrap: break-word;
        }
        .message .user {
            font-weight: bold;
            color: #00d4ff;
            font-size: 12px;
        }
        .message .text {
            margin-top: 5px;
        }
        .message .time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }
        .message.own .user,
        .message.own .time {
            color: #0a7a99;
        }
        .message.system {
            background-color: #555;
            text-align: center;
            font-style: italic;
            color: #ccc;
            align-self: center;
            max-width: 100%;
        }
        .status.error {
            background-color: #5c0000;
            color: #ff6b6b;
            border-left: 4px solid #ff6b6b;
        }
        .back-btn {
            background-color: #666;
            color: white;
            margin-bottom: 10px;
        }
        .back-btn:hover {
            background-color: #555;
        }
        .call-btn {
            width: auto;
            padding: 5px 9px;
            margin-left: 6px;
            background-color: #35c759;
            color: #102515;
            font-size: 12px;
        }
        .call-controls {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #24452b;
            border-radius: 5px;
        }
        .call-controls.active {
            display: flex;
        }
        .call-controls button {
            flex: 0 0 auto;
            width: auto;
            padding: 7px 12px;
            background-color: #ff6b6b;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 Secure Chat Server</h1>
        
        <div class="button-group">
            <button class="host-btn" onclick="showHostForm()">🔐 Start Chat</button>
            <button class="join-btn" onclick="showJoinForm()">📝 Join Chat</button>
        </div>
        
        <!-- Host Form -->
        <div id="hostForm" class="form-section">
            <h2>🔐 Start Protected Chat</h2>
            <input type="text" id="serverName" placeholder="Chat name (e.g. Milan's Chat)">
            <input type="text" id="username" placeholder="Your username">
            <input type="password" id="password" placeholder="Password (share with others)">
            <button class="submit-btn" onclick="hostServer()">Start Chat</button>
        </div>
        
        <!-- Join Form -->
        <div id="joinForm" class="form-section">
            <h2>📝 Join Protected Chat</h2>
            <input type="text" id="roomId" placeholder="Room ID (from host)">
            <input type="password" id="joinPassword" placeholder="Password">
            <input type="text" id="joinUsername" placeholder="Your username">
            <button class="submit-btn" onclick="joinServer()">Connect</button>
        </div>
        
        <!-- Chat Area -->
        <div id="chatArea" class="chat-area">
            <button class="back-btn" onclick="disconnect()">← Back</button>
            <div class="server-info">
                <span id="roomInfo"></span>
                <span id="roomId2"></span>
            </div>
            <div class="users-list" id="usersList"></div>
            <div class="call-controls" id="callControls">
                <span id="callStatus">Call active</span>
                <button onclick="endCall()">End call</button>
            </div>
            <div class="messages" id="messages"></div>
            <div class="message-input-group">
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
        
        <!-- Status -->
        <div id="status" class="status"></div>
    </div>
    
    <script>
        let currentUsername = '';
        let currentRoomId = null;
        let lastMessageCount = 0;
        let refreshInterval = null;
        let signalId = 0;
        let peerConnection = null;
        let localStream = null;
        let activeCallUser = null;
        let pendingIceCandidates = [];

        let rtcConfig = {
            iceServers: [{urls: 'stun:stun.l.google.com:19302'}]
        };

        fetch('/rtc-config')
            .then(response => response.json())
            .then(config => { rtcConfig = config; })
            .catch(() => console.warn('TURN configuration is unavailable'));
        
        function showHostForm() {
            document.getElementById('hostForm').classList.add('active');
            document.getElementById('joinForm').classList.remove('active');
            document.getElementById('chatArea').classList.remove('active');
            document.getElementById('status').classList.remove('active');
        }
        
        function showJoinForm() {
            document.getElementById('joinForm').classList.add('active');
            document.getElementById('hostForm').classList.remove('active');
            document.getElementById('chatArea').classList.remove('active');
            document.getElementById('status').classList.remove('active');
        }
        
        function hostServer() {
            const serverName = document.getElementById('serverName').value || 'Chat Room';
            const password = document.getElementById('password').value;
            currentUsername = document.getElementById('username').value || 'Host';
            
            if (!password) {
                showStatus('❌ Enter a password!', 'error');
                return;
            }
            if (!currentUsername) {
                showStatus('❌ Enter a username!', 'error');
                return;
            }
            
            fetch('/create-server', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: serverName, password: password, username: currentUsername})
            })
            .then(r => r.json())
            .then(data => {
                if (data.error || !data.room_id) {
                    throw new Error(data.error || 'The chat room could not be created');
                }

                currentRoomId = data.room_id;
                document.getElementById('hostForm').classList.remove('active');
                document.getElementById('chatArea').classList.add('active');
                document.getElementById('roomInfo').textContent = `🏠 ${data.room_name || serverName}`;
                document.getElementById('roomId2').textContent = `ID: ${currentRoomId}`;
                showStatus(`✅ Chat started! Share Room ID: ${currentRoomId}`, 'success');
                startPolling();
                loadMessages();
            })
            .catch(err => showStatus('❌ Error: ' + err, 'error'));
        }
        
        function joinServer() {
            const roomId = document.getElementById('roomId').value;
            const password = document.getElementById('joinPassword').value;
            currentUsername = document.getElementById('joinUsername').value || 'User';
            
            if (!roomId) {
                showStatus('❌ Enter Room ID!', 'error');
                return;
            }
            if (!password) {
                showStatus('❌ Enter password!', 'error');
                return;
            }
            if (!currentUsername) {
                showStatus('❌ Enter username!', 'error');
                return;
            }
            
            fetch('/join-server', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({room_id: roomId, password: password, username: currentUsername})
            })
            .then(r => r.json())
            .then(data => {
                if (data.error || !data.room_id) {
                    throw new Error(data.error || 'The chat room could not be joined');
                }

                currentRoomId = roomId;
                document.getElementById('joinForm').classList.remove('active');
                document.getElementById('chatArea').classList.add('active');
                document.getElementById('roomInfo').textContent = `🏠 ${data.room_name || 'Chat Room'}`;
                document.getElementById('roomId2').textContent = `ID: ${roomId}`;
                showStatus(`✅ Connected as ${currentUsername}!`, 'success');
                startPolling();
                loadMessages();
            })
            .catch(err => showStatus('❌ ' + (err.message || 'Connection error'), 'error'));
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !currentRoomId) return;
            
            fetch('/send-message', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({room_id: currentRoomId, message: message, username: currentUsername})
            })
            .then(r => r.json())
            .then(data => {
                input.value = '';
                loadMessages();
            })
            .catch(err => console.error('Send error:', err));
        }
        
        function loadMessages() {
            if (!currentRoomId) return;
            
            fetch(`/get-messages?room_id=${currentRoomId}`)
                .then(r => r.json())
                .then(data => {
                    updateMessages(data.messages);
                    updateUsers(data.users);
                    processSignals();
                })
                .catch(err => console.error('Load error:', err));
        }
        
        function updateMessages(messages) {
            const messagesDiv = document.getElementById('messages');
            
            // Only add new messages
            if (messages.length > lastMessageCount) {
                const newMessages = messages.slice(lastMessageCount);
                newMessages.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    
                    if (msg.username === 'System') {
                        msgDiv.className = 'message system';
                        msgDiv.textContent = msg.message;
                    } else {
                        msgDiv.className = msg.username === currentUsername ? 'message own' : 'message';
                        msgDiv.innerHTML = `
                            <div class="user">${msg.username}</div>
                            <div class="text">${msg.message}</div>
                            <div class="time">${msg.timestamp}</div>
                        `;
                    }
                    
                    messagesDiv.appendChild(msgDiv);
                });
                
                lastMessageCount = messages.length;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }
        
        function updateUsers(users) {
            const usersList = document.getElementById('usersList');
            usersList.innerHTML = '<strong>👥 Online:</strong> ';
            users.forEach(username => {
                const user = document.createElement('span');
                user.className = 'user';
                user.textContent = username;
                if (username !== currentUsername) {
                    const callButton = document.createElement('button');
                    callButton.className = 'call-btn';
                    callButton.textContent = '📞 Call';
                    callButton.onclick = () => startCall(username);
                    user.appendChild(callButton);
                }
                usersList.appendChild(user);
            });
        }
        
        function startPolling() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(loadMessages, 1000);
        }
        
        function disconnect() {
            if (refreshInterval) clearInterval(refreshInterval);
            currentRoomId = null;
            lastMessageCount = 0;
            signalId = 0;
            endCall();
            document.getElementById('chatArea').classList.remove('active');
            document.getElementById('messages').innerHTML = '';
            document.getElementById('usersList').innerHTML = '';
            showHostForm();
        }

        async function sendSignal(recipient, type, payload) {
            await fetch('/send-signal', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    room_id: currentRoomId,
                    sender: currentUsername,
                    recipient: recipient,
                    type: type,
                    payload: JSON.stringify(payload)
                })
            });
        }

        async function startCall(username) {
            if (peerConnection) return;
            try {
                activeCallUser = username;
                localStream = await navigator.mediaDevices.getUserMedia({audio: true});
                createPeerConnection(username);
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                await sendSignal(username, 'offer', offer);
                setCallStatus(`Calling ${username}...`);
            } catch (error) {
                showStatus('❌ Microphone access is required to call.', 'error');
                endCall();
            }
        }

        function createPeerConnection(username) {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.onicecandidate = event => {
                if (event.candidate) sendSignal(username, 'ice', event.candidate);
            };
            peerConnection.ontrack = event => {
                let audio = document.getElementById('remoteAudio');
                if (!audio) {
                    audio = document.createElement('audio');
                    audio.id = 'remoteAudio';
                    audio.autoplay = true;
                    document.body.appendChild(audio);
                }
                audio.srcObject = event.streams[0];
            };
            document.getElementById('callControls').classList.add('active');
        }

        async function processSignals() {
            if (!currentRoomId || !currentUsername) return;
            const response = await fetch(`/get-signals?room_id=${encodeURIComponent(currentRoomId)}&recipient=${encodeURIComponent(currentUsername)}&after_id=${signalId}`);
            const data = await response.json();
            for (const signal of data.signals || []) {
                signalId = Math.max(signalId, signal.id);
                const payload = JSON.parse(signal.payload);
                if (signal.signal_type === 'offer') await receiveOffer(signal.sender, payload);
                if (signal.signal_type === 'answer' && peerConnection) await peerConnection.setRemoteDescription(payload);
                if (signal.signal_type === 'ice' && peerConnection) await peerConnection.addIceCandidate(payload);
                if (signal.signal_type === 'end') endCall(false);
            }
        }

        async function receiveOffer(username, offer) {
            if (peerConnection || !confirm(`${username} is calling you. Answer?`)) return;
            try {
                activeCallUser = username;
                localStream = await navigator.mediaDevices.getUserMedia({audio: true});
                createPeerConnection(username);
                await peerConnection.setRemoteDescription(offer);
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                await sendSignal(username, 'answer', answer);
                setCallStatus(`Talking with ${username}`);
            } catch (error) {
                showStatus('❌ Could not start the microphone.', 'error');
                endCall();
            }
        }

        function setCallStatus(message) {
            document.getElementById('callStatus').textContent = message;
        }

        function endCall(notify = true) {
            if (notify && activeCallUser && currentRoomId) sendSignal(activeCallUser, 'end', {});
            if (peerConnection) peerConnection.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            const audio = document.getElementById('remoteAudio');
            if (audio) audio.remove();
            peerConnection = null;
            localStream = null;
            activeCallUser = null;
            pendingIceCandidates = [];
            document.getElementById('callControls').classList.remove('active');
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status active ${type}`;
        }
        
        // Enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && document.getElementById('messageInput') && document.getElementById('messageInput').value) {
                sendMessage();
            }
        });
    </script>
</body>
</html>
