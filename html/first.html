<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chatprivate.nl</title>
  <style>
    :root{--ink:#17221f;--muted:#68736e;--paper:#f7f3eb;--card:#fffdf8;--accent:#e2693d;--line:#ded8cd;--green:#315c4d}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 5%,#f5c7a9 0 13%,transparent 35%),var(--paper);color:var(--ink);font-family:Georgia,serif;min-height:100vh}main{width:min(980px,calc(100% - 32px));margin:auto;padding:46px 0 70px}.brand{font:700 15px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--green)}h1{font-size:clamp(40px,7vw,78px);line-height:.94;margin:34px 0 14px;max-width:700px}h2{font-size:30px;margin:0 0 20px}.lead{font-size:20px;line-height:1.45;max-width:560px;color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);padding:28px;border-radius:8px;box-shadow:0 16px 45px #5f4b3212;margin-top:28px}.narrow{max-width:500px;margin-left:auto;margin-right:auto}.hidden{display:none!important}.tabs,.actions{display:flex;gap:10px;flex-wrap:wrap}.tabs{border-bottom:1px solid var(--line);margin-bottom:22px}.tabs button{border:0;background:none;color:var(--muted);padding:10px 4px;border-bottom:3px solid transparent}.tabs button.active{color:var(--ink);border-color:var(--accent)}button{font:700 15px Arial,sans-serif;cursor:pointer;border:0;border-radius:5px;padding:13px 17px;background:var(--accent);color:white}button.secondary{background:#e8e2d7;color:var(--ink)}button.icon{font-size:26px;padding:8px 15px;line-height:1;background:var(--green)}input{display:block;width:100%;padding:14px;margin:10px 0;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font:16px Arial,sans-serif}label{font:700 12px Arial,sans-serif;color:var(--muted);display:block;margin-top:14px}.notice{padding:12px 14px;margin:14px 0;background:#f2e9dc;border-left:4px solid var(--accent);font:14px Arial,sans-serif}.error{background:#f9e2dc;color:#8c2f1d}.success{background:#e0eee6;color:#275542}.topline{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.room{border:1px solid var(--line);padding:18px;background:#fff;border-radius:5px}.room button{margin-top:14px;width:100%;padding:10px}.muted{color:var(--muted);font:14px Arial,sans-serif}.chat{margin-top:22px}.messages{height:310px;overflow:auto;background:#f1eee8;padding:14px;border:1px solid var(--line);border-radius:5px}.message{padding:8px 11px;background:white;border-radius:5px;margin:8px 0;max-width:80%;font:15px Arial,sans-serif}.message.own{background:#dcece4;margin-left:auto}.message b{font-size:12px;color:var(--green)}.send{display:flex;gap:8px;margin-top:10px}.send input{margin:0;flex:1}.send button{width:auto}.users{font:13px Arial,sans-serif;color:var(--muted);margin:12px 0}.users button{padding:6px 9px;margin-left:8px;font-size:12px;background:var(--green)}.callbar{display:flex;align-items:center;gap:10px;background:#e0eee6;padding:10px;margin:10px 0;font:14px Arial,sans-serif}.callbar button{background:#b8432b;padding:7px 10px}.check{display:flex;gap:9px;align-items:center;font:14px Arial,sans-serif;margin:14px 0}.check input{width:auto;margin:0}.room-picker{display:grid;grid-template-columns:1fr 1fr;gap:12px}.room-picker button{padding:22px;background:var(--green)}@media(max-width:650px){main{padding-top:28px}.panel{padding:20px}.rooms{grid-template-columns:1fr}.room-picker{grid-template-columns:1fr}.topline{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
  </style>
</head>
<body><main><div class="brand">Chatprivate.nl</div>
<section id="auth"><h1>Private gesprekken, eenvoudig geregeld.</h1><p class="lead">Maak een account aan met je eigen gebruikersnaam. Die naam is zichtbaar in je private chats.</p><div class="panel narrow"><div class="tabs"><button id="loginTab" class="active" onclick="showAuth('login')">Inloggen</button><button id="registerTab" onclick="showAuth('register')">Account aanmaken</button><button id="forgotTab" onclick="showAuth('forgot')">Wachtwoord vergeten</button></div>
<form id="loginForm" onsubmit="submitLogin(event)"><label>Email</label><input id="loginEmail" type="email" required><label>Wachtwoord</label><input id="loginPassword" type="password" required><button>Inloggen</button></form>
<form id="registerForm" class="hidden" onsubmit="submitRegister(event)"><label>Gebruikersnaam</label><input id="registerUsername" minlength="3" required><label>Email</label><input id="registerEmail" type="email" required><label>Wachtwoord (minimaal 8 tekens)</label><input id="registerPassword" type="password" minlength="8" required><button>Code versturen</button></form>
<form id="forgotForm" class="hidden" onsubmit="requestReset(event)"><label>Email</label><input id="forgotEmail" type="email" required><button>Verificatiecode versturen</button></form><form id="codeForm" class="hidden" onsubmit="submitCode(event)"><label>Verificatiecode</label><input id="code" inputmode="numeric" minlength="6" maxlength="6" required><button>Code controleren</button></form><div id="authNotice"></div></div></section>
<section id="dashboard" class="hidden"><div class="topline"><div><h2>Welkom, <span id="welcome"></span></h2><div class="muted">Je opgeslagen rooms</div></div><div class="actions"><button class="icon" title="Room maken of joinen" onclick="openRoomPicker()">+</button><button class="secondary" onclick="logout()">Uitloggen</button></div></div><div id="rooms" class="rooms"></div><div id="dashboardNotice"></div><div id="roomPicker" class="panel hidden"><h2>Wat wil je doen?</h2><div class="room-picker"><button onclick="openRoomForm('create')">Room maken</button><button onclick="openRoomForm('join')">Room joinen</button></div></div>
<div id="roomForm" class="panel hidden"><h2 id="roomFormTitle"></h2><form onsubmit="submitRoom(event)"><div id="createFields"><label>Naam van de room</label><input id="roomName" placeholder="Bijvoorbeeld: Team avond"></div><div id="joinFields" class="hidden"><label>Room ID</label><input id="roomIdInput"><label>Room wachtwoord</label><input id="roomPassword" type="password"></div><label>Room wachtwoord</label><input id="createPassword" type="password"><label class="check"><input id="saveRoom" type="checkbox"> Deze room opslaan (maximaal 3)</label><button id="roomSubmit">Room openen</button></form></div>
<div id="chat" class="panel chat hidden"><div class="topline"><div><h2 id="chatName"></h2><div class="muted">Room ID: <span id="chatId"></span></div></div><button class="secondary" onclick="leaveChat()">Terug</button></div><div class="users" id="users"></div><div id="callBar" class="callbar hidden"><span id="callStatus"></span><button onclick="endCall()">Gesprek stoppen</button></div><div class="messages" id="messages"></div><form class="send" onsubmit="sendMessage(event)"><input id="messageInput" autocomplete="off" placeholder="Schrijf een bericht..."><button>Verstuur</button></form></div></section></main>
<script>
let pendingEmail='',resetMode=false,currentRoom=null,poll=null,username='';const $=id=>document.getElementById(id);
function showAuth(mode){['login','register','forgot'].forEach(x=>{$(x+'Form').classList.toggle('hidden',x!==mode);$(x+'Tab').classList.toggle('active',x===mode)});$('codeForm').classList.add('hidden');$('authNotice').innerHTML=''}function notice(id,text,error=false){$(id).innerHTML='<div class="notice '+(error?'error':'success')+'">'+text+'</div>'}async function api(url,body){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Er ging iets mis');return d}
async function submitLogin(e){e.preventDefault();try{let d=await api('/api/login',{email:$('loginEmail').value,password:$('loginPassword').value});username=d.username;loadDashboard()}catch(x){notice('authNotice',x.message,true)}}async function submitRegister(e){e.preventDefault();pendingEmail=$('registerEmail').value;try{await api('/api/register',{email:pendingEmail,username:$('registerUsername').value,password:$('registerPassword').value});resetMode=false;$('registerForm').classList.add('hidden');$('codeForm').classList.remove('hidden');notice('authNotice','Controleer je email en vul de 6-cijferige code in.')}catch(x){notice('authNotice',x.message,true)}}async function requestReset(e){e.preventDefault();pendingEmail=$('forgotEmail').value;try{await api('/api/forgot/request',{email:pendingEmail});resetMode=true;$('forgotForm').classList.add('hidden');$('codeForm').classList.remove('hidden');notice('authNotice','Als dit emailadres bestaat, is er een code verstuurd.')}catch(x){notice('authNotice',x.message,true)}}async function submitCode(e){e.preventDefault();try{await api(resetMode?'/api/forgot/verify':'/api/verify',{email:pendingEmail,code:$('code').value});showAuth('login');notice('authNotice',resetMode?'Je tijdelijke wachtwoord is per email verstuurd.':'Account geverifieerd. Je kunt nu inloggen.')}catch(x){notice('authNotice',x.message,true)}}
async function loadDashboard(){let d=await fetch('/api/me').then(r=>r.json());if(!d.user){$('auth').classList.remove('hidden');return}username=d.user.username;$('auth').classList.add('hidden');$('dashboard').classList.remove('hidden');$('welcome').textContent=username;renderRooms(d.rooms)}function renderRooms(rooms){$('rooms').innerHTML=rooms.length?rooms.map(r=>'<div class="room"><h3>'+escapeHtml(r.name)+'</h3><div class="muted">ID: '+r.room_id+'</div><button onclick="openSaved(\''+r.room_id+'\')">Openen</button></div>').join(''):'<div class="muted">Nog geen opgeslagen rooms. Gebruik + om er een te maken.</div>'}function openRoomPicker(){$('roomPicker').classList.remove('hidden');$('roomForm').classList.add('hidden')}function openRoomForm(mode){$('roomPicker').classList.add('hidden');$('roomForm').classList.remove('hidden');$('roomForm').dataset.mode=mode;$('roomFormTitle').textContent=mode==='create'?'Nieuwe room maken':'Een room joinen';$('createFields').classList.toggle('hidden',mode!=='create');$('joinFields').classList.toggle('hidden',mode==='create');$('roomSubmit').textContent=mode==='create'?'Room maken':'Joinen'}async function submitRoom(e){e.preventDefault();let mode=$('roomForm').dataset.mode,body=mode==='create'?{name:$('roomName').value,password:$('createPassword').value,save:$('saveRoom').checked}:{room_id:$('roomIdInput').value,password:$('roomPassword').value,save:$('saveRoom').checked};try{let d=await api(mode==='create'?'/create-server':'/join-server',body);openChat(d);loadDashboard()}catch(x){notice('dashboardNotice',x.message,true)}}async function openSaved(id){let password=prompt('Vul het room wachtwoord in:');if(!password)return;try{openChat(await api('/join-server',{room_id:id,password}))}catch(x){notice('dashboardNotice',x.message,true)}}function openChat(d){currentRoom=d.room_id;$('chatName').textContent=d.room_name;$('chatId').textContent=d.room_id;$('chat').classList.remove('hidden');$('roomForm').classList.add('hidden');loadMessages();clearInterval(poll);poll=setInterval(loadMessages,1200)}async function loadMessages(){if(!currentRoom)return;let d=await fetch('/get-messages?room_id='+encodeURIComponent(currentRoom)).then(r=>r.json());if(d.error)return;$('users').textContent='Aanwezig: '+d.users.join(', ');$('messages').innerHTML=d.messages.map(m=>'<div class="message '+(m.username===username?'own':'')+'"><b>'+escapeHtml(m.username)+'</b><div>'+escapeHtml(m.message)+'</div><small>'+m.timestamp+'</small></div>').join('');$('messages').scrollTop=$('messages').scrollHeight}async function sendMessage(e){e.preventDefault();let input=$('messageInput'),message=input.value.trim();if(!message)return;await api('/send-message',{room_id:currentRoom,message});input.value='';loadMessages()}function leaveChat(){clearInterval(poll);currentRoom=null;$('chat').classList.add('hidden')}async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}function escapeHtml(s){return String(s).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}loadDashboard();
</script>
<script>
let callPeer=null, callStream=null, callPartner=null, signalCursor=0;
const callButton=document.createElement('button');
callButton.textContent='Audio bellen'; callButton.className='secondary'; callButton.style.marginTop='10px';
callButton.onclick=()=>startAudioCall(prompt('Gebruikersnaam om te bellen:'));
document.getElementById('chat').appendChild(callButton);
async function sendCallSignal(recipient,type,payload){return api('/send-signal',{room_id:currentRoom,recipient,type,payload:JSON.stringify(payload)})}
function callState(text){$('callBar').classList.remove('hidden');$('callStatus').textContent=text}
async function startAudioCall(target){if(!target||!currentRoom||target===username||callPeer)return;try{callPartner=target;callStream=await navigator.mediaDevices.getUserMedia({audio:true});createAudioPeer(target);let offer=await callPeer.createOffer();await callPeer.setLocalDescription(offer);await sendCallSignal(target,'offer',offer);callState('Bellen met '+target+'...')}catch(e){alert('Microfoon-toegang is nodig voor audio bellen.');stopAudioCall(false)}}
function createAudioPeer(target){callPeer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});callStream.getTracks().forEach(track=>callPeer.addTrack(track,callStream));callPeer.onicecandidate=e=>e.candidate&&sendCallSignal(target,'ice',e.candidate);callPeer.ontrack=e=>{let audio=document.getElementById('remoteAudio')||document.createElement('audio');audio.id='remoteAudio';audio.autoplay=true;audio.srcObject=e.streams[0];document.body.appendChild(audio)}}
async function checkAudioSignals(){if(!currentRoom)return;let d=await fetch('/get-signals?room_id='+encodeURIComponent(currentRoom)+'&recipient='+encodeURIComponent(username)+'&after_id='+signalCursor).then(r=>r.json());for(let s of d.signals||[]){signalCursor=Math.max(signalCursor,s.id);let payload=JSON.parse(s.payload);if(s.signal_type==='offer'&&!callPeer){if(!confirm(s.sender+' belt je. Opnemen?'))continue;callPartner=s.sender;callStream=await navigator.mediaDevices.getUserMedia({audio:true});createAudioPeer(s.sender);await callPeer.setRemoteDescription(payload);let answer=await callPeer.createAnswer();await callPeer.setLocalDescription(answer);await sendCallSignal(s.sender,'answer',answer);callState('In gesprek met '+s.sender)}else if(s.signal_type==='answer'&&callPeer)await callPeer.setRemoteDescription(payload);else if(s.signal_type==='ice'&&callPeer)await callPeer.addIceCandidate(payload);else if(s.signal_type==='end')stopAudioCall(false)}}
function stopAudioCall(notify=true){if(notify&&callPartner&&currentRoom)sendCallSignal(callPartner,'end',{});if(callPeer)callPeer.close();if(callStream)callStream.getTracks().forEach(track=>track.stop());let audio=document.getElementById('remoteAudio');if(audio)audio.remove();callPeer=null;callStream=null;callPartner=null;$('callBar').classList.add('hidden')}
function endCall(notify=true){stopAudioCall(notify)}
async function loadMessages(){if(!currentRoom)return;let d=await fetch('/get-messages?room_id='+encodeURIComponent(currentRoom)).then(r=>r.json());if(d.error)return;let users=$('users');users.textContent='Aanwezig: ';(d.users||[]).forEach(name=>{let label=document.createElement('span');label.textContent=name+' ';users.appendChild(label);if(name!==username){let button=document.createElement('button');button.textContent='Audio bellen';button.onclick=()=>startAudioCall(name);users.appendChild(button)}});$('messages').innerHTML=(d.messages||[]).map(m=>'<div class="message '+(m.username===username?'own':'')+'"><b>'+escapeHtml(m.username)+'</b><div>'+escapeHtml(m.message)+'</div><small>'+m.timestamp+'</small></div>').join('');$('messages').scrollTop=$('messages').scrollHeight}
setInterval(checkAudioSignals,1200);
</script></body></html>
