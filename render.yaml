services:
  - type: web
    name: chatprivate
    runtime: python
    rootDir: py
    buildCommand: pip install -r ../requirements.txt
    startCommand: gunicorn app:app
    disk:
      name: chatprivate-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/chat.db
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: py123456789v@gmail.com
      - key: SMTP_FROM
        value: py123456789v@gmail.com
      - key: SMTP_PASSWORD
        sync: false